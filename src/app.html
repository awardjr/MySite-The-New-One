<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script nonce="%sveltekit.nonce%">
			try {
				const saved = localStorage.getItem('theme');
				const theme = ['light', 'dark', 'hotdog'].includes(saved)
					? saved
					: matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark'
						: 'light';
				if (theme !== 'light') document.documentElement.classList.add(theme);
			} catch {}
		</script>
		<script nonce="%sveltekit.nonce%">
			addEventListener('message', (event) => {
				const height = event.data?.height;
				if (event.origin !== 'https://embed.bsky.app' || typeof height !== 'number') return;
				for (const frame of document.querySelectorAll('iframe')) {
					if (frame.contentWindow === event.source) frame.style.height = `${height}px`;
				}
			});
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		data-sveltekit-preload-code="viewport"
		class="bg-page text-body antialiased min-h-screen"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
